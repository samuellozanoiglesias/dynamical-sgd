use_gpu: false

data:
  dataset_name: rings
  data_dir: ./data
  num_classes: 3
  points_per_class: 100
  noise_std: 0.05
  class_separation: 0.15
  center_radius: 0.1
  num_rings: 2
  random_seed: 0
model:
  architecture: mlp_relu
  init_type: glorot
  nn_width: 50
  num_hidden_layers: 1
  use_bias: true
training:
  training_steps: 500000
  save_metrics_every_n_steps: 50
  batch_size: 200
  random_seed: 42
  loss: cross_entropy
optimizer:
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-08
  gradient_clipping: null
  l2_reg: 0.0
  learning_rate: 0.002
  momentum: 0.9
  optimizer_type: adam
dynamics:
  bumps_before_TPT: false
  bumps_at_TPT: false
  period_length: 5000
  w_max: 70.0
  amplitude: 1.0
  bump_order: [0, 1, 2]
  tpt_accuracy_threshold: 1.0
analysis:
  plot_version: simplified
  outputs:
    classifier_metrics: true
    nc_metrics: true
    separability_metrics: false
    pca_analysis: true
    pca_geometric: true
    hyperplane_metrics: true
  pca:
    projected_dims: [1, 2, 3, 5]
output:
  output_dir: /data/samuel_lozano/dynamical-sgd
