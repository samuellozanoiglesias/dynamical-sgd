# Systematic Study Configuration for Dynamical SGD
# This file configures parameter ranges for systematic parameter studies

# Parameter ranges to sweep over
w_max_values: [1, 50, 100, 150]
period_values: [100, 500, 1000, 5000]
learning_rates: [0.002, 1.0]
batch_sizes: [50, 200]
network_widths: [50]

# Training configuration
total_periods: 15            # Number of complete periods to train
base_period: 5000           # Base period length for calculating total steps
points_per_class: 100       # Data points per class
num_classes: 3              # Number of classes (spiral arms)

# Output configuration
output_dir: "systematic_study_results"
save_individual_results: true    # Save each experiment result separately
save_summary: true              # Save combined summary
create_plots: false             # Create plots for each experiment (can be slow)

# Execution optimization
skip_w_max_1_variants: true     # Only run w_max=1 with period=5000 (baseline)