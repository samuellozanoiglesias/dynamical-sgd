use_gpu: true

data:
  dataset_name: mnist
  data_dir: ./data
  num_classes: 10
  random_seed: 0

model:
  architecture: resnet18
  init_type: glorot
  resnet_base_width: 64
  use_bias: true

training:
  training_steps: 164150  # 350 epochs × ceil(60000/128) steps/epoch = 350 × 469
  save_metrics_every_n_steps: 469  # 1 checkpoint per epoch (= steps_per_epoch)
  batch_size: 128
  random_seed: 42
  loss: cross_entropy

optimizer:
  optimizer_type: sgd 
  learning_rate: 0.0679
  momentum: 0.9
  weight_decay: 5.0e-4
  gradient_clipping: null
  nesterov: false

dynamics:
  bumps_before_TPT: false
  bumps_at_TPT: false
  period_length: 5000
  w_max: 70.0
  amplitude: 1.0
  bump_order:
  tpt_accuracy_threshold: 1.0

analysis:
  metric_subset_size: 5000
  plot_version: simplified
  outputs:
    classifier_metrics: false
    nc_metrics: false
    separability_metrics: false
    pca_analysis: false
    pca_geometric: false
    hyperplane_metrics: false
    proj_nc_analysis: false
  pca:
    projected_dims: [1, 2, 3, 5]

output:
  output_dir: /data/samuel_lozano/dynamical-sgd