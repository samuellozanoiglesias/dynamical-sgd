use_gpu: true

data:
  dataset_name: mnist
  data_dir: ./data
  num_classes: 10
  random_seed: 0

model:
  architecture: resnet18_cnn

training:
  training_steps: 7000          # 350 × 20
  save_metrics_every_n_steps: 1  # 1 checkpoint per "epoch" (=20 steps), matches original epoch cadence
  batch_size: 128
  random_seed: 42
  loss: cross_entropy

optimizer:
  optimizer_type: sgd
  learning_rate: 0.0679
  momentum: 0.9
  weight_decay: 5.0e-4
  gradient_clipping: null
  nesterov: false

dynamics:
  bumps_before_tpt: true
  bumps_at_tpt: true
  period_length: 100
  w_max: 70.0
  amplitude: 1.0
  bump_order:
  tpt_accuracy_threshold: 1.0

analysis:
  metric_subset_size: 5000
  plot_version: simplified
  outputs:
    classifier_metrics: true
    nc_metrics: true
    separability_metrics: false
    pca_analysis: false
    pca_geometric: true
    hyperplane_metrics: false
    proj_nc_analysis: true
  pca:
    projected_dims: [1, 2, 3, 5]

output:
  output_dir: /data/samuel_lozano/dynamical-sgd