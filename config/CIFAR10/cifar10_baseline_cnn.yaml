# Baseline: train a normal 10-class CIFAR-10 CNN from scratch.
#
# Run:
#   python launch.py --config config/cifar10_baseline_cnn.yaml

use_gpu: true

data:
  dataset_name: cifar10
  data_dir: ./data
  num_classes: 10

model:
  architecture: resnet18_cnn
  cnn:
    backbone: resnet18
    resnet:
      num_stages: 4
      blocks_per_stage: [2, 2, 2, 2]   # "resnet10"
      width_mult: 1.0

training:
  training_steps: 10000
  save_metrics_every_n_steps: 1
  batch_size: 128
  random_seed: 42
  loss: cross_entropy

optimizer:
  optimizer_type: sgd
  learning_rate: 0.0679
  momentum: 0.9
  weight_decay: 0.0005
  gradient_clipping: null
  nesterov: false

dynamics:
  bumps_before_tpt: false
  bumps_at_tpt: false

analysis:
  metric_subset_size: 5000
  plot_version: simplified
  compute_results: average
  outputs:
    classifier_metrics: false
    nc_metrics: false
    separability_metrics: false
    pca_analysis: false
    pca_geometric: false
    hyperplane_metrics: false
    proj_nc_analysis: false
    multiclass_metrics: true
  pca:
    projected_dims:
    - 1
    - 2
    - 3
    - 5

output:
  output_dir: /data/samuel_lozano/dynamical-sgd