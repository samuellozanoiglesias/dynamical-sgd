# Default configuration for dynamical SGD experiments
description: "Default dynamical SGD experiment with spiral dataset"
random_seed: 42
device: "auto"
precision: "float32"

# Data configuration
data:
  points_per_class: 100
  num_classes: 3
  revolutions: 4.0
  noise_std: 0.2
  test_ratio: 0.2
  normalization_method: "none"
  augmentation: false
  augmentation_noise_std: 0.05
  augmentation_rotation_range: 0.1
  random_seed: 0

# Model configuration
model:
  nn_width: 100
  num_classes: 3
  activation: "relu"
  use_bias: true
  weight_init_scale: 1.0
  random_seed: 0

# Optimizer configuration
optimizer:
  optimizer_type: "adam"
  learning_rate: 0.01
  momentum: 0.9
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-8
  l2_reg: 0.0
  gradient_clipping: null

# Dynamics configuration
dynamics:
  period_length: 5000
  w_max: 70.0
  class_focus_pattern: "sequential"
  enable_dynamics: true

# Training configuration
training:
  total_steps: 75000
  batch_size: 50
  n_steps_per_epoch: 1
  validation_interval: 100
  checkpoint_interval: 1000
  early_stopping: false
  early_stopping_patience: 10
  early_stopping_min_delta: 1.0e-4

# Analysis configuration
analysis:
  track_weight_diff: true
  weight_diff_step_interval: 100
  track_gradients: true
  gradient_tracking_interval: 10
  track_distributions: true
  distribution_analysis_ranges:
    - [0, 1500]
    - [2300, 3000]
    - [3500, 5000]
  compute_kl_divergences: true
  compute_correlations: true
  track_activations: false

# Visualization configuration
visualization:
  real_time_visualization: false
  vis_step_interval: 100
  save_decision_boundaries: true
  decision_boundary_interval: 1000
  save_training_curves: true
  save_weight_evolution: true
  save_gradient_distributions: true
  create_animations: false
  animation_fps: 2
  plot_style: "seaborn"
  figure_format: "png"
  figure_dpi: 150

# Output configuration
output:
  output_dir: "outputs"
  experiment_name: "dynamical_sgd_experiment"
  save_checkpoints: true
  save_final_model: true
  save_metrics: true
  save_analysis_data: true
  cleanup_intermediate_files: false
  compress_outputs: false