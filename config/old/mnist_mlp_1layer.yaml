use_gpu: false

data:
  dataset_name: mnist
  data_dir: ./data
  num_classes: 10
  random_seed: 42
model:
  architecture: mlp
  init_type: glorot
  nn_width: 100
  num_hidden_layers: 1
  use_bias: true
training:
  training_steps: 25000
  save_metrics_every_n_steps: 50
  batch_size: 200
  random_seed: 42
  loss: cross_entropy
optimizer:
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-08
  gradient_clipping: null
  l2_reg: 0.0
  learning_rate: 0.01
  momentum: 0.9
  optimizer_type: adam
dynamics:
  bumps_before_tpt: false
  bumps_at_tpt: false
  period_length: 250
  w_max: 50.0
  amplitude: 1.0
  tpt_accuracy_threshold: 1.0
output:
  output_dir: /data/samuel_lozano/dynamical-sgd
