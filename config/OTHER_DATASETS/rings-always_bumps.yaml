use_gpu: false

data:
  dataset_name: rings
  data_dir: ./data
  num_classes: 3
  points_per_class: 100
  noise_std: 0.05
  class_separation: 0.15
  center_radius: 0.1
  num_rings: 2
  random_seed: 0
model:
  architecture: mlp_relu
  init_type: glorot
  nn_width: 50
  num_hidden_layers: 1
  use_bias: true
training:
  training_steps: 500000
  save_metrics_every_n_steps: 50
  batch_size: 200
  random_seed: 0
  loss: cross_entropy
optimizer:
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-08
  gradient_clipping: null
  l2_reg: 0.0
  learning_rate: 0.002
  momentum: 0.9
  optimizer_type: adam
dynamics:
  bumps_before_tpt: true
  bumps_at_tpt: true
  period_length: 5000
  w_max: 70.0
  amplitude: 1.0
  bump_order: [0, 1, 2]
  tpt_accuracy_threshold: 1.0
analysis:
  plot_version: simplified
  outputs:
    classifier_metrics: false
    nc_metrics: false
    separability_metrics: false
    pca_analysis: false
    pca_geometric: false
    hyperplane_metrics: false
    proj_nc_analysis: false
    multiclass_metrics: true
    deep_inside_training: true
  pca:
    projected_dims: [1, 2, 3, 5]
  # How often (in save_metrics_every_n_steps units) to run the
  # deep_inside_training landscape diagnostics (Hessian power iteration
  # + minibatch gradient resampling). 1 = every save point, 10 = every
  # 10th. These are more expensive than the other per-epoch metrics.
  deep_inside_training_stride: 10
videos:
  enabled: true
  every_n_steps: 2500        # snapshot cadence, in training steps
  fps: 60                     # gif playback speed
  feature_layer: pre_classifier   # input | first_activation_post | pre_classifier
  umap_seed: 0
  pca:
    reduce_dim: 3       # dimensionality PCA reduces the feature layer to
    plot_dim: 3         # 2 or 3 -- how many of those dims to scatter-plot
  umap:
    reduce_dim: 3       # dimensionality UMAP reduces the feature layer to
    plot_dim: 3         # 2 or 3 -- how many of those dims to scatter-plot
  # For both pca and umap, reduce_dim must be >= plot_dim (you can't plot
  # more dimensions than you reduced to).
  decision_boundary_grid_size: 250
  align_embeddings: true
  standardize_embeddings: false
output:
  output_dir: /data/samuel_lozano/dynamical-sgd
