use_gpu: false

data:
  dataset_name: spiral
  data_dir: ./data
  num_classes: 3
  points_per_class: 1000
  revolutions: 5.0
  noise_std: 0.1
  test_ratio: 0.25
  min_radius: 0.02
  random_seed: 0
  # Optional explicit initial class angles in degrees.
  # Keep null for homogeneous spacing; provide a list (length = num_classes)
  # if you want different initial angles.
  angular_offsets: null
model:
  architecture: mlp
  nn_width: 50
  num_hidden_layers: 1
  use_bias: true
training:
  training_steps: 200000
  steps_per_epoch: 50
  batch_size: 200
  random_seed: 42
  loss: cross_entropy
optimizer:
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-08
  gradient_clipping: null
  l2_reg: 0.0
  learning_rate: 0.002
  momentum: 0.9
  optimizer_type: adam
dynamics:
  bumps_before_TPT: true
  bumps_at_TPT: true
  period_length: 5000
  w_max: 70.0
  amplitude: 1.0
  tpt_accuracy_threshold: 1.0
output:
  output_dir: /data/samuel_lozano/dynamical-sgd
