use_gpu: false

data:
  dataset_name: spiral
  data_dir: ./data
  num_classes: 3
  points_per_class: 100
  revolutions: 4.0
  noise_std: 0.2
  min_radius: 0.01
  random_seed: 0
  angular_offsets: null
model:
  architecture: resnet18
  init_type: glorot
  resnet_base_width: 16
  use_bias: true
training:
  training_steps: 25000
  save_metrics_every_n_steps: 50
  batch_size: 200
  random_seed: 42
  loss: cross_entropy
optimizer:
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-08
  gradient_clipping: null
  l2_reg: 0.0
  learning_rate: 0.01
  momentum: 0.9
  optimizer_type: adam
dynamics:
  bumps_before_TPT: true
  bumps_at_TPT: true
  period_length: 5000
  w_max: 70.0
  amplitude: 1.0
  bump_order: 
  tpt_accuracy_threshold: 1.0
analysis:
  metric_subset_size: 5000
  plot_version: simplified
  outputs:
    classifier_metrics: true
    nc_metrics: true
    separability_metrics: false
    pca_analysis: false
    pca_geometric: true
  pca:
    projected_dims: [1, 2, 3, 5]
output:
  output_dir: /data/samuel_lozano/dynamical-sgd
