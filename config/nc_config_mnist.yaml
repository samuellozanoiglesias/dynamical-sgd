# Neural Collapse MNIST Experiment Configuration  
# MNIST training using ResNet-18 architecture from torchvision
# Tests Neural Collapse emergence in high-dimensional real data
#
# This configuration drives neuralcollapse_notebook.py script
# which implements the Neural Collapse notebook-equivalent pipeline

# Dataset configuration
data:
  dataset_name: "mnist"  # Must be "mnist" to trigger notebook pipeline
  
  # MNIST-specific parameters
  data_dir: "./data"
  flatten: false         # Keep as 28x28 images for ResNet-18 (CNN architecture)
  normalize: true        # Apply standard MNIST normalization (mean=0.1307, std=0.3081)
  download: true         # Download MNIST if not present
  
  # Dataset parameters
  num_classes: 10        # MNIST has 10 classes (0-9)
  num_channels: 1        # Grayscale images
  image_size: 28         # 28x28, padded to 32x32 by neuralcollapse_notebook.py
  random_seed: 0

# Model architecture - ResNet-18 for MNIST
model:
  architecture: "resnet18"  # ResNet-18 from torchvision
  
  # ResNet-18 specific parameters  
  pretrained: false      # Random initialization
  num_classes: 10        # MNIST has 10 classes
  use_bias: true         # Enable bias in final layer
  final_layer_features: 512  # ResNet18 outputs 512-dim features

# Training configuration - MNIST ResNet-18 (training-step based)
training:
  training_steps: 60000
  steps_per_epoch: 200  # MNIST train set (60k) / batch size (128) ≈ 470 steps/epoch
  batch_size: 128             # Training batch size (hardcoded in neuralcollapse_notebook.py)
  eval_batch_size: 128        # Evaluation batch size

# Optimizer configuration - SGD with momentum (tuned for MNIST)
optimizer:
  optimizer_type: "sgd"  # SGD with momentum
  learning_rate: 0.0679  # Tuned learning rate for CrossEntropyLoss on MNIST
  momentum: 0.9          # Momentum for SGD
  l2_reg: 5e-4           # Weight decay (hardcoded in neuralcollapse_notebook.py)

# Dynamic class focus (bumping) configuration - controlled by environment variables
dynamics:
  bumps_before_TPT: true        # Set by NC_BUMPS_BEFORE_TPT environment variable
  bumps_at_TPT: false           # Set by NC_BUMPS_AT_TPT environment variable
  period_length: 1000           # Set by NC_PERIOD_LENGTH (training steps per class cycle)
  w_max: 50.0                   # Set by NC_W_MAX (maximum class weight)
  tpt_accuracy_threshold: 1.0   # Set by NC_TPT_ACCURACY_THRESHOLD (100% = zero training error)

# Analysis configuration
analysis:
  track_neural_collapse: true  # Compute NC metrics after every epoch (every ~470 training steps)

# Visualization configuration
visualization:
  save_training_curves: true    # Save loss/accuracy plots
  save_nc_visualizations: true  # Save NC metric evolution plots
  save_sample_visualizations: true  # Visualize MNIST samples
  figure_dpi: 150

# Output configuration
output:
  output_dir: "outputs"  # Base directory (subfolders created by run_nc_experiment.py)
  experiment_name: "nc_mnist_resnet18"
  save_metrics: true        # Save nc_results.csv
  save_final_model: false   # Skip model checkpointing
  save_checkpoints: false

# Device configuration
device: "auto"  # "auto", "gpu", or "cpu"
random_seed: 42

# Expected Neural Collapse behavior for MNIST with ResNet-18 (10 classes):
# 
# Terminal Phase Training (TPT) emerges when training error approaches zero
#   - Typically reached around training step 2500-3500 (5-7 epochs, depending on bumping)
#   - TPT threshold: training accuracy ≥ 100% (zero training error)
#
# Neural Collapse Properties (NC metrics monitored by neuralcollapse_notebook.py):
#   - NC1: Within-class feature variability collapses to near-zero
#   - NC2 Equinorm: Class center norms approach equality (CV -> 0)
#   - NC2 Equiangularity: Class centers become equiangular
#       Target angle for 10 classes: -1/(C-1) = -1/9 ≈ -0.111
#       Geometric angle: arccos(-1/9) ≈ 96.4 degrees
#   - NC3 Self-Duality: Classifier weights align with class centers
#   - NC4 NCC Mismatch: Classifier predictions match nearest class center predictions
#
# Dynamics Modes Impact on Training (measured in training steps):
#   - never:    Standard SGD, smooth convergence to TPT around step ~2500-3000
#   - pre_tpt:  Class focusing accelerates TPT emergence, stops at step ~2500-3500
#   - tpt_only: Standard training until TPT, then class focusing begins
#   - always:   Continuous class focusing throughout all 5120 training steps
#
# Training Steps Calculation:
#   - MNIST train set: 60,000 samples
#   - Batch size: 128
#   - Steps per epoch: 60,000 ÷ 128 ≈ 470 steps (actual: 469-470 with shuffle)
#   - Total training steps: ~470 steps/epoch × 10 epochs ≈ 5120 steps
#
# ResNet-18 Architecture for MNIST:
#   - Input: 1 channel (grayscale), 28x28 -> padded to 32x32
#   - Conv1: kernel=3 (He et al. 2015), no max pooling (1x1 kernel)
#   - ResNet blocks: 4 residual blocks (18 layers total)
#   - Global average pooling -> 10-class output
#   - Total parameters: ~11.2 million (standard ResNet18)