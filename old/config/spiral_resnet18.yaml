description: "Spiral dataset with ResNet18"
random_seed: 42
device: "auto"

# Data configuration
data:
  dataset_name: "spiral"
  points_per_class: 500
  num_classes: 3
  revolutions: 10.0
  noise_std: 0.1
  test_ratio: 0.25
  random_seed: 0
  randomize_offsets: false
  angular_offsets: null
  min_radius: 0.05

# Model configuration
model:
  architecture: "resnet18"
  use_bias: true

# Training configuration
training:
  total_steps: 25000
  save_metrics_every_n_steps: 50
  batch_size: 200

# Dynamics configuration
dynamics:
  bumps_before_TPT: true
  bumps_at_TPT: false
  period_length: 500
  w_max: 50.0
  tpt_accuracy_threshold: 1.0

# Output configuration
output:
  output_dir: "outputs"
  experiment_name: "spiral_resnet18"
